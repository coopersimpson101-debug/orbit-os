name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: zig build, host tests, QEMU virt boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain and QEMU
        run: |
          python -m pip install --upgrade pip
          pip install ziglang pytest pyelftools unicorn
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version

      - name: Build kernels (virt, rpi5, rv64) + chainloaders
        run: python build.py

      - name: Host unit tests (pytest + C tests, Unicorn smoke boot)
        run: python -m pytest -v tests

      - name: QEMU virt boot test (direct -kernel, enters at EL2)
        run: python tools/qemu_test.py --mode direct

      - name: QEMU virt boot test (UART chainloader over TCP)
        run: python tools/qemu_test.py --mode chainload

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-os-images
          path: |
            build/virt/*.img
            build/virt/*.elf
            build/rpi5/*.img
            build/rpi5/*.elf
            build/rv64/kernel.elf
            build/rv64/kernel.bin

  rv64-qemu:
    name: rv64 build, image checks, QEMU riscv64 virt boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain and QEMU
        run: |
          python -m pip install --upgrade pip
          pip install ziglang pytest pyelftools
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc
          qemu-system-riscv64 --version

      - name: Build rv64 (RV64IMA_Zicsr_Zifencei, 256 KiB)
        run: python build.py --board rv64

      - name: rv64 image checks (no RVC, entry, 256 KiB budget) + scause/Sv39 unit tests
        run: python -m pytest -v tests -k "rv64 or scause or sv39"

      - name: QEMU riscv64 virt boot test (-bios none, M-mode entry, own SBI shim)
        run: python tools/qemu_test.py --board rv64

  make-gcc:
    name: Makefile build with GNU cross gcc + QEMU boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc-aarch64-linux-gnu and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm
      - name: make
        run: make CROSS=aarch64-linux-gnu- -j"$(nproc)"
      - name: Boot the gcc-built virt image
        run: python3 tools/qemu_test.py --mode direct --build-dir build-make/virt
