<path d="M0 10a10 10 0 0 1 10-10h868a10 10 0 0 1 10 10v20H0z" fill="#161b22"/>
<circle cx="20" cy="15" r="6" fill="#ff5f57"/><circle cx="40" cy="15" r="6" fill="#febc2e"/><circle cx="60" cy="15" r="6" fill="#28c840"/>
<text x="444.0" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">OrbitOS - UART console, qemu-virt image on the Unicorn emulator</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<text x="22" y="58" fill="#e6edf3"><tspan fill="#22D3EE">$</tspan> python tools/uniboot.py build/virt/kernel8.img --cmd "spawn user" --cmd "ps" --cmd "spawn ufault"</text>
<text x="22" y="77" fill="#e6edf3"></text>
<text x="22" y="96" fill="#8b949e">OrbitOS v0.1.0 (qemu-virt) - hobby AArch64 kernel</text>
<text x="22" y="115" fill="#8b949e">[boot] entered at EL1, now at EL1, dtb=0x48000000, image 0x40080000-0x400cd000</text>
<text x="22" y="134" fill="#8b949e">[fdt] device tree at 0x48000000, 728 bytes</text>
<text x="22" y="153" fill="#8b949e">[boot] RAM 0x40000000 + 512 MiB (dtb /memory reg[0])</text>
<text x="22" y="172" fill="#8b949e">[mmu] enabled: identity map + kernel sections at 4K, devices nGnRE, 9 tables</text>
<text x="22" y="191" fill="#8b949e">[mm] buddy: 130834 pages free (511 MiB) at [0x400ed000, 0x60000000), 1 reserved range(s)</text>
<text x="22" y="210" fill="#8b949e">[mmu] higher-half alias self-test: OK</text>
<text x="22" y="229" fill="#8b949e">[gic] GICv2 at D=0x8000000 C=0x8010000, 256 interrupt lines</text>
<text x="22" y="248" fill="#8b949e">[timer] 100 Hz tick on INTID 30 (CNTFRQ 62500000 Hz)</text>
<text x="22" y="267" fill="#8b949e">[uart] RX interrupt driven</text>
<text x="22" y="286" fill="#8b949e">[boot] boot complete, enabling interrupts</text>
<text x="22" y="305" fill="#e6edf3"></text>
<text x="22" y="324" fill="#8b949e">OrbitOS shell - type 'help'</text>
<text x="22" y="343" fill="#e6edf3"><tspan fill="#22D3EE">orbit&gt;</tspan> spawn user</text>
<text x="22" y="362" fill="#e6edf3"><tspan fill="#22D3EE">orbit&gt;</tspan> [user] hello from EL0, pid 2</text>
<text x="22" y="381" fill="#A5F3FC">[user] tick 1 (sleep 100 ms via SVC)</text>
<text x="22" y="400" fill="#A5F3FC">[user] tick 2 (sleep 100 ms via SVC)</text>
<text x="22" y="419" fill="#A5F3FC">[user] tick 3 (sleep 100 ms via SVC)</text>
<text x="22" y="438" fill="#A5F3FC">[user] bad pointer correctly rejected with -EFAULT</text>
<text x="22" y="457" fill="#A5F3FC">[user] exiting with code 42</text>
<text x="22" y="476" fill="#8b949e">[sched] thread 2 (user) exited with code 42</text>
<text x="22" y="495" fill="#e6edf3">ps</text>
<text x="22" y="514" fill="#e6edf3">TID  NAME             PRIO  STATE     MODE  TICKS</text>
<text x="22" y="533" fill="#e6edf3">0    idle             7     ready     EL1   576</text>
<text x="22" y="552" fill="#e6edf3">1    shell            1     running   EL1   0  &lt;- you</text>
<text x="22" y="571" fill="#e6edf3"><tspan fill="#22D3EE">orbit&gt;</tspan> spawn ufault</text>
<text x="22" y="590" fill="#e6edf3"><tspan fill="#22D3EE">orbit&gt;</tspan> [user] about to read kernel memory from EL0...</text>
<text x="22" y="609" fill="#e6edf3"></text>
<text x="22" y="628" fill="#ff7b72">*** exception: EL0 sync in thread 3 (ufault)</text>
<text x="22" y="647" fill="#ff7b72">    ESR_EL1=0x9200000f  EC=0x24 data abort (lower EL): permission fault L3, read</text>
<text x="22" y="666" fill="#ff7b72">    ELR_EL1=0x40081040  FAR_EL1=0x40091000  SPSR=0x60000000</text>
<text x="22" y="685" fill="#ff7b72">    -&gt; killing user task 3</text>
<text x="22" y="704" fill="#8b949e">[sched] thread 3 (ufault) exited with code -1</text>
</g>
<text x="22" y="734" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Real UART output of build/virt/kernel8.img, emulated (tools/uniboot.py), not hardware. Regenerate: docs/assets/make_figures.py</text>
</svg>
